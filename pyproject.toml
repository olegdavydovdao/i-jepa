[project]
name = "i-jepa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Oleg Davydov", email = "oleg.davydov.dao@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[project.scripts]
i-jepa = "i_jepa:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
